name: Bilibili Watcher

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node scripts/search.js
        env:
          BILI_MID: ${{ secrets.BILI_MID }}
          BILI_COOKIE: ${{ secrets.BILI_COOKIE }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
